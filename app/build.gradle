plugins { id 'com.android.application' }

import java.util.Properties
import java.util.Base64

def signingPropertiesFile = [
    rootProject.file('sign/signing.properties'),
    rootProject.file('signing.properties')
].find { it.exists() }
def signingProperties = new Properties()
if (signingPropertiesFile != null) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('release') }
if (releaseRequested && signingPropertiesFile == null) {
    throw new GradleException('Release signing is not configured. Run setup-release-signing.ps1 first.')
}

def decodeSigningSecret = { String encoded -> new String(Base64.decoder.decode(encoded), 'UTF-8') }

android {
    namespace 'bg.stefantsvyatkov.voxtxt'
    compileSdk { version = release(37) }

    defaultConfig {
        applicationId 'bg.stefantsvyatkov.voxtxt'
        minSdk 26
        targetSdk { version = release(37) }
        versionCode 4
        versionName '1.0-beta4'
    }

    signingConfigs {
        if (signingPropertiesFile != null) {
            release {
                storeFile new File(signingPropertiesFile.parentFile, signingProperties.getProperty('storeFile'))
                storePassword decodeSigningSecret(signingProperties.getProperty('storePasswordBase64'))
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword decodeSigningSecret(signingProperties.getProperty('keyPasswordBase64'))
            }
        }
    }

    buildTypes {
        release {
            if (signingPropertiesFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Google Play splits an App Bundle by language and installs only the device's own. The in-app Language
    // setting changes the locale at runtime, so a user on an English phone choosing Български would get
    // English strings back. Keeping every language in the base module is what makes that setting work.
    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The two libraries behind Read the web page. Readability4J is a port of the same Readability that
    // Firefox uses for its Reader View; jsoup is the HTML parser both it and the app rely on. Readability4J
    // asks for an old jsoup, so the current one is declared here and wins - the same pairing a live reader
    // app on Play (Feeder) ships today.
    implementation 'org.jsoup:jsoup:1.23.1'
    implementation 'net.dankito.readability4j:readability4j:1.0.8'
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        // Named after the release label in versionName ('1.0-beta3' -> VoxTXT-beta3.apk), so a new release
        // never ships under the previous release's file name.
        def version = android.defaultConfig.versionName
        def label = version.contains('-') ? version.substring(version.indexOf('-') + 1) : version
        variant.outputs.each { output ->
            output.outputFileName.set("VoxTXT-${label}.apk")
        }
    }
}
